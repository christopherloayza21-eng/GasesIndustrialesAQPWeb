<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario | Gases Industriales AQP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Sistema interno</p>
      <h1>Inventario y operaciones</h1>
    </div>
    <button id="refreshButton" type="button">Actualizar</button>
  </header>

  <main class="page">
    <nav class="tabs" aria-label="Módulos del sistema">
      <button class="tab-button active" type="button" data-view="dashboardView">Dashboard</button>
      <button class="tab-button" type="button" data-view="clientesView">Clientes</button>
      <button class="tab-button" type="button" data-view="productosView">Productos</button>
      <button class="tab-button" type="button" data-view="cilindrosView">Cilindros</button>
      <button class="tab-button" type="button" data-view="pedidosView">Pedidos</button>
      <button class="tab-button" type="button" data-view="movimientosView">Movimientos</button>
      <button class="tab-button" type="button" data-view="recargasView">Recargas</button>
      <button class="tab-button" type="button" data-view="maestrosView">Maestros</button>
    </nav>

    <section id="dashboardView" class="view active">
      <section class="summary-grid" aria-label="Resumen operativo">
        <article class="summary-card"><span>Cilindros disponibles</span><strong id="cilindrosDisponibles">-</strong></article>
        <article class="summary-card"><span>En clientes</span><strong id="cilindrosEnClientes">-</strong></article>
        <article class="summary-card"><span>En proveedor</span><strong id="cilindrosEnProveedor">-</strong></article>
        <article class="summary-card"><span>Pedidos pendientes</span><strong id="pedidosPendientes">-</strong></article>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div><p class="eyebrow">Trazabilidad</p><h2>Movimientos recientes</h2></div>
          <p id="statusText">Cargando datos...</p>
        </div>
        <div class="table-wrapper">
          <table>
            <thead><tr><th>Fecha</th><th>Cilindro</th><th>Producto</th><th>Movimiento</th><th>Cliente</th><th>Observación</th></tr></thead>
            <tbody id="movimientosBody"></tbody>
          </table>
        </div>
      </section>
    </section>

    <section id="clientesView" class="view" data-module="clientes"></section>
    <section id="productosView" class="view" data-module="productos"></section>
    <section id="cilindrosView" class="view" data-module="cilindros"></section>
    <section id="pedidosView" class="view" data-module="pedidos"></section>
    <section id="movimientosView" class="view" data-module="movimientos"></section>
    <section id="recargasView" class="view" data-module="recargas"></section>
    <section id="maestrosView" class="view">
      <section class="split-grid">
        <div data-module="zonas"></div>
        <div data-module="conductores"></div>
        <div data-module="vehiculos"></div>
        <div data-module="proveedores"></div>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
